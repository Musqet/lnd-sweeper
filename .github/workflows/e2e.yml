name: E2E (regtest)

# Drives real bitcoind + lnd on regtest. Slow, so not on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # nightly, 03:17 UTC

permissions:
  contents: read

env:
  NODE_ENV: production

jobs:
  e2e:
    name: bitcoind + lnd regtest
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prod=false

      # Versions, tarball SHA-256s, the guix.sigs commit for Bitcoin Core builder
      # keys and the lnd commit for maintainer keys are all pinned in the script.
      # It checks the maintainers' GPG signatures on SHA256SUMS / the lnd manifest
      # (>= 3 Core builders, >= 2 lnd maintainers), then the tarballs against both
      # the signed list and our own pinned hash. Update all pins together.
      - name: Download and verify bitcoind, lnd and chantools (GPG + SHA-256)
        run: |
          set -eu
          scripts/verify-upstream-binaries.sh "$RUNNER_TEMP/bin" x86_64
          sudo install -m 0755 "$RUNNER_TEMP"/bin/bitcoind "$RUNNER_TEMP"/bin/bitcoin-cli "$RUNNER_TEMP"/bin/lnd "$RUNNER_TEMP"/bin/lncli "$RUNNER_TEMP"/bin/chantools /usr/local/bin/
          bitcoind --version | head -n1
          lnd --version
          chantools --version

      - name: Build
        run: pnpm build

      - name: Run e2e tests
        env:
          BITCOIND_BIN: /usr/local/bin/bitcoind
          BITCOIN_CLI_BIN: /usr/local/bin/bitcoin-cli
          LND_BIN: /usr/local/bin/lnd
          LNCLI_BIN: /usr/local/bin/lncli
          CHANTOOLS_BIN: /usr/local/bin/chantools
        run: pnpm test:e2e

      - name: Upload regtest logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs-${{ github.run_id }}
          path: |
            .e2e-data/**/*.log
            .e2e-data/**/debug.log
          if-no-files-found: ignore
          retention-days: 7
