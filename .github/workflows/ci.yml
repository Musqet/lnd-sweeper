name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A development build inlines the dev mock and changes the hash. Never build one here.
  NODE_ENV: production

jobs:
  build:
    name: Typecheck, test, build, verify reproducible
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Version comes from packageManager in package.json.

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        # NODE_ENV=production would skip devDependencies; the build needs them.
        run: pnpm install --frozen-lockfile --prod=false

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify reproducible build
        run: scripts/verify-reproducible.sh

      - name: Verify maintainer key matches the documented fingerprint
        run: scripts/verify-maintainer-key.sh

      - name: Print hash
        run: sha256sum dist/lnd-sweeper.html

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lnd-sweeper-${{ github.sha }}
          path: dist/lnd-sweeper.html
          if-no-files-found: error
          retention-days: 30
